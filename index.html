<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1f2e">
<title>Mechanic's Garage</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root { --bg:#12151f; --card:#1c2230; --card2:#232a3b; --accent:#4f8cff;
  --text:#e8ecf4; --muted:#8b93a7; --danger:#ff6b6b; --ok:#4cd97b; --radius:12px; }
body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg);
  color:var(--text); min-height:100vh; }
.hidden { display:none !important; }
.muted { color:var(--muted); } .small { font-size:.82rem; }
.error { color:var(--danger); font-size:.85rem; min-height:1.2em; margin:4px 0; }
#authScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.auth-card { background:var(--card); border-radius:var(--radius); padding:32px 24px;
  width:100%; max-width:380px; display:flex; flex-direction:column; gap:12px;
  text-align:center; box-shadow:0 10px 40px rgba(0,0,0,.5); }
.auth-card h1 { font-size:1.4rem; }
input, select, textarea { width:100%; padding:12px 14px; border-radius:10px;
  border:1px solid #333d55; background:var(--bg); color:var(--text); font-size:1rem; outline:none; }
input:focus, select:focus, textarea:focus { border-color:var(--accent); }
label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
textarea { resize:vertical; }
.btn { padding:12px 18px; border:none; border-radius:10px; background:var(--card2);
  color:var(--text); font-size:1rem; cursor:pointer; font-weight:600; }
.btn:active { transform:scale(.97); }
.btn-primary { background:var(--accent); }
.btn-block { width:100%; }
.btn-small { padding:8px 14px; font-size:.9rem; }
.btn-link { background:none; color:var(--accent); font-weight:400; }
.btn-outline { border:1px solid #333d55; display:inline-block; }
.btn-danger { background:#3a2530; color:var(--danger); }
.app-header { display:flex; justify-content:space-between; align-items:center;
  padding:14px 16px; background:var(--card); position:sticky; top:0; z-index:10;
  border-bottom:1px solid #262e42; }
.app-title { font-weight:700; font-size:1.1rem; }
.toolbar { display:flex; gap:10px; padding:12px 16px; }
.toolbar input { flex:1; }
.cards { padding:4px 16px 40px; display:flex; flex-direction:column; gap:12px; }
.card { background:var(--card); border-radius:var(--radius); padding:16px;
  cursor:pointer; border:1px solid #262e42; }
.card:active { background:var(--card2); }
.card-title { font-weight:700; font-size:1.05rem; margin-bottom:4px; }
.card-sub { color:var(--muted); font-size:.88rem; line-height:1.5; }
.card-row { display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
.badge-money { color:var(--ok); font-weight:700; }
.vin-badge { font-family:monospace; letter-spacing:.5px; }
.car-info { padding:14px 16px; background:var(--card); margin-bottom:8px; }
.car-info .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 16px; font-size:.92rem; }
.car-info .info-grid span { color:var(--muted); }
.section-head { display:flex; justify-content:space-between; align-items:center;
  padding:14px 16px 6px; }
.section-head h2 { font-size:1.05rem; }
.work-total { padding:0 16px 8px; color:var(--ok); font-weight:700; }
.date-group { display:flex; flex-direction:column; gap:8px; }
.date-header { width:100%; display:flex; justify-content:space-between; align-items:center;
  background:var(--card2); border:none; border-radius:10px; padding:13px 14px;
  color:var(--text); font-size:1rem; font-weight:600; cursor:pointer; }
.date-header:active { transform:scale(.98); }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.65); z-index:100;
  overflow-y:auto; padding:20px 12px; }
.modal-content { background:var(--card); border-radius:var(--radius);
  max-width:480px; margin:0 auto; padding:20px; }
.modal-content h2 { margin-bottom:8px; font-size:1.2rem; }
.modal-actions { display:flex; gap:10px; margin-top:18px; }
.modal-actions .btn { flex:1; }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
.vin-actions { display:flex; gap:10px; margin-top:8px; flex-wrap:wrap; }
.add-type-row { display:flex; gap:8px; margin-top:6px; }
.hidden-input { display:none; }
.photo-preview { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.photo-preview img { width:64px; height:64px; object-fit:cover; border-radius:8px; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--ok); color:#08130c; font-weight:600; padding:12px 22px;
  border-radius:10px; z-index:200; box-shadow:0 6px 24px rgba(0,0,0,.4); }
.empty { text-align:center; color:var(--muted); padding:40px 0; }
.db-error { margin:12px 16px; padding:12px 14px; background:#3a2530; color:var(--danger);
  border-radius:10px; font-size:.85rem; line-height:1.5; }
@media (min-width:700px) { .cards, .toolbar { max-width:640px; margin:0 auto; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<base target="_blank">
</head>
<body>

<div id="authScreen" class="screen">
  <div class="auth-card">
    <h1>🔧 Mechanic's Garage</h1>
    <p class="muted">Vehicle records & service history</p>
    <div id="authNameWrap" class="hidden"><input type="text" id="authName" placeholder="Your name"></div>
    <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
    <input type="password" id="authPassword" placeholder="Password (min 6 characters)" autocomplete="current-password">
    <div id="authError" class="error"></div>
    <button id="authSubmit" class="btn btn-primary btn-block">Sign in</button>
    <button id="authToggle" class="btn btn-link">No account? Sign up</button>
    <button id="authReset" class="btn btn-link">Forgot password?</button>
  </div>
</div>

<div id="appScreen" class="screen hidden">
  <header class="app-header">
    <div><div class="app-title">Mechanic's Garage</div><div id="userInfo" class="muted small"></div></div>
    <div style="display:flex;gap:8px">
      <button id="settingsBtn" class="btn btn-small" title="Company settings">⚙️</button>
      <button id="logoutBtn" class="btn btn-small">Log out</button>
    </div>
  </header>
  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search: VIN, make, plate...">
    <button id="addCarBtn" class="btn btn-primary">+ Car</button>
  </div>
  <div id="dbError" class="db-error hidden"></div>
  <div id="carsList" class="cards"></div>
</div>

<div id="carScreen" class="screen hidden">
  <header class="app-header">
    <button id="backBtn" class="btn btn-small">← Back</button>
    <div id="carHeaderTitle" class="app-title"></div>
  </header>
  <div id="carInfo" class="car-info"></div>
  <div class="section-head"><h2>Service history</h2><div style="display:flex;gap:8px;align-items:center"><button id="invoiceBtn" class="btn btn-small" title="Download invoice PDF">🧾 PDF</button><select id="worksFilter" style="width:auto;padding:9px 10px;font-size:.9rem"><option value="all">All mechanics</option><option value="mine">My jobs</option></select><button id="addWorkBtn" class="btn btn-primary">+ Job</button></div></div>
  <div id="worksList" class="cards"></div>
</div>

<div id="carModal" class="modal hidden">
  <div class="modal-content">
    <h2 id="carModalTitle">New vehicle</h2>
    <label>VIN (17 characters)</label>
    <input type="text" id="vinInput" maxlength="17" placeholder="e.g. 1HGBH41JXMN109186" style="text-transform:uppercase">
    <div class="vin-actions">
      <label class="btn btn-small btn-outline">📷 Scan VIN photo
        <input type="file" id="vinPhotoInput" accept="image/*" capture="environment" class="hidden-input"></label>
      <button id="decodeVinBtn" class="btn btn-small btn-outline">🔍 Decode VIN</button>
    </div>
    <div id="vinStatus" class="muted small"></div>
    <div class="grid-2">
      <div><label>Make</label><input type="text" id="carMake" placeholder="Toyota"></div>
      <div><label>Model</label><input type="text" id="carModel" placeholder="Camry"></div>
      <div><label>Year</label><input type="number" id="carYear" placeholder="2020"></div>
      <div><label>License plate</label>
        <div style="display:flex;gap:6px">
          <input type="text" id="carPlate" placeholder="ABC-1234" style="flex:1">
          <select id="carState" style="width:76px;padding:12px 6px"></select>
        </div>
      </div>
      <div><label>Mileage, mi</label><input type="number" id="carMileage" placeholder="85000"></div>
      <div><label>Owner phone</label><input type="tel" id="carPhone" placeholder="+1..."></div>
    </div>
    <label>Customer name</label>
    <input type="text" id="carCustomer" placeholder="John Smith">
    <label>Notes</label>
    <input type="text" id="carNotes" placeholder="Color, features...">
    <div id="carModalError" class="error"></div>
    <div class="modal-actions">
      <button id="cancelCarBtn" class="btn">Cancel</button>
      <button id="saveCarBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<div id="workModal" class="modal hidden">
  <div class="modal-content">
    <h2 id="workModalTitle">New job</h2>
    <label>Date</label>
    <input type="date" id="workDate">
    <label>Mechanic</label>
    <input type="text" id="workMechanic" placeholder="Your name">
    <label>Job type</label>
    <select id="workType"></select>
    <div class="add-type-row">
      <input type="text" id="newTypeInput" placeholder="New job type...">
      <button id="addTypeBtn" class="btn btn-small">Add</button>
    </div>
    <div class="grid-2">
      <div><label>Parts, $</label><input type="number" id="workParts" placeholder="0" min="0"></div>
      <div><label>Labor, $</label><input type="number" id="workLabor" placeholder="0" min="0"></div>
    </div>
    <label>Comment</label>
    <textarea id="workComment" rows="3" placeholder="What was done, which parts were used..."></textarea>
    <label>Photos (up to 5)</label>
    <label class="btn btn-small btn-outline">📷 Add photos
      <input type="file" id="workPhotos" accept="image/*" multiple class="hidden-input"></label>
    <div id="photoPreview" class="photo-preview"></div>
    <div id="workModalError" class="error"></div>
    <div class="modal-actions">
      <button id="cancelWorkBtn" class="btn">Cancel</button>
      <button id="saveWorkBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal hidden">
  <div class="modal-content">
    <h2>Company settings</h2>
    <label>Garage / company name</label>
    <input type="text" id="setName" placeholder="e.g. Zufar Auto Repair">
    <label>Address</label>
    <input type="text" id="setAddress" placeholder="123 Main St, Brooklyn, NY">
    <label>Phone</label>
    <input type="tel" id="setPhone" placeholder="+1 (718) 000-0000">
    <label>Sales tax, % (e.g. 8.875)</label>
    <input type="number" id="setTax" step="0.001" min="0" placeholder="8.875">
    <div id="settingsError" class="error"></div>
    <div class="modal-actions">
      <button id="cancelSettingsBtn" class="btn">Cancel</button>
      <button id="saveSettingsBtn" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script type="module">
// ============================================================
//  PASTE YOUR FIREBASE CONFIG HERE (between the markers)
//  Firebase Console -> Project settings -> Your apps -> Web app
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyD__Jzn8xJZgJKUg61iFdEHF-uHc9HL6Tw",
  authDomain: "zayamz-90eb4.firebaseapp.com",
  projectId: "zayamz-90eb4",
  storageBucket: "zayamz-90eb4.firebasestorage.app",
  messagingSenderId: "229322967157",
  appId: "1:229322967157:web:4809483e9ffd1c6b3ad03c",
  measurementId: "G-9WQBG77FSH"
};
// ============================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, doc, getDoc, setDoc,
  onSnapshot, deleteDoc, arrayUnion, updateDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + new Intl.NumberFormat('en-US').format(Math.round(n || 0));
const fmtDate = d => {
  if (!d) return '';
  const p = String(d).split('-');
  return p.length === 3 ? `${p[1]}/${p[2]}/${p[0]}` : d;
};
const today = () => new Date().toISOString().slice(0, 10);

const US_STATES = ["AL", "AK", "AZ", "AR", "CA", "CO", "CT", "DE", "DC", "FL", "GA", "HI", "ID", "IL", "IN", "IA", "KS", "KY", "LA", "ME", "MD", "MA", "MI", "MN", "MS", "MO", "MT", "NE", "NV", "NH", "NJ", "NM", "NY", "NC", "ND", "OH", "OK", "OR", "PA", "RI", "SC", "SD", "TN", "TX", "UT", "VT", "VA", "WA", "WV", "WI", "WY"];

let user = null, cars = [], currentCarId = null, works = [];
let editingCarId = null, editingWorkId = null;
let workTypes = ['Engine oil change','Transmission fluid change','Scheduled maintenance',
  'Brake pads replacement','Suspension repair','Diagnostics',
  'Timing belt replacement','Tire service','Engine repair','Other'];
const DEFAULT_TYPES = [...workTypes];
let selectedPhotos = [];

function showDbError(err) {
  const el = $('dbError');
  el.classList.remove('hidden');
  el.innerHTML = '<b>Database error:</b> ' + esc(err.message || err.code || err) +
    '<br>Check in Firebase Console: Firestore Database -> Rules -> allow read, write: if request.auth != null';
}

// ===== SIGN IN / SIGN UP =====
let isRegisterMode = false;
$('authToggle').onclick = () => {
  isRegisterMode = !isRegisterMode;
  $('authNameWrap').classList.toggle('hidden', !isRegisterMode);
  $('authSubmit').textContent = isRegisterMode ? 'Sign up' : 'Sign in';
  $('authToggle').textContent = isRegisterMode
    ? 'Already have an account? Sign in' : 'No account? Sign up';
  $('authError').textContent = '';
};

$('authSubmit').onclick = async () => {
  const email = $('authEmail').value.trim();
  const password = $('authPassword').value;
  const name = $('authName').value.trim();
  $('authError').textContent = '';
  if (!email || !password) { $('authError').textContent = 'Enter email and password'; return; }
  const btn = $('authSubmit');
  btn.disabled = true;
  btn.textContent = isRegisterMode ? 'Signing up...' : 'Signing in...';
  try {
    if (isRegisterMode) {
      if (password.length < 6) { $('authError').textContent = 'Password must be at least 6 characters'; return; }
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      if (name) await updateProfile(cred.user, { displayName: name });
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    $('authError').textContent = friendlyAuthError(e.code);
  } finally {
    btn.disabled = false;
    btn.textContent = isRegisterMode ? 'Sign up' : 'Sign in';
  }
};

$('authReset').onclick = async () => {
  const email = $('authEmail').value.trim();
  $('authError').textContent = '';
  if (!email) { $('authError').textContent = 'Enter your email above, then tap "Forgot password?" again'; return; }
  try {
    await sendPasswordResetEmail(auth, email);
    alert('Password reset email sent to ' + email + '. Check inbox and spam folder.');
  } catch (e) {
    $('authError').textContent = friendlyAuthError(e.code);
  }
};

function friendlyAuthError(code) {
  const map = {
    'auth/invalid-email': 'Invalid email',
    'auth/email-already-in-use': 'This email is already registered',
    'auth/weak-password': 'Weak password (min 6 characters)',
    'auth/invalid-credential': 'Wrong email or password',
    'auth/user-not-found': 'User not found',
    'auth/wrong-password': 'Wrong password',
    'auth/too-many-requests': 'Too many attempts, try later',
    'auth/network-request-failed': 'No internet connection',
    'auth/configuration-not-found': 'Firebase config error. Check apiKey/authDomain in the file.'
  };
  return map[code] || 'Error: ' + code;
}

$('logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, u => {
  user = u;
  if (u) {
    $('authScreen').classList.add('hidden');
    $('carScreen').classList.add('hidden');
    $('appScreen').classList.remove('hidden');
    $('userInfo').textContent = (u.displayName || 'Mechanic') + ' · ' + u.email;
    $('dbError').classList.add('hidden');
    subscribeCars();
    loadWorkTypes();
    loadCompany();
  } else {
    $('appScreen').classList.add('hidden');
    $('carScreen').classList.add('hidden');
    $('authScreen').classList.remove('hidden');
  }
});

function fillStateSelect() {
  $('carState').innerHTML = US_STATES.map(c => `<option value="${c}"${c === 'NY' ? ' selected' : ''}>${c}</option>`).join('');
}
fillStateSelect();

// ===== VEHICLES (sorted client-side, no DB index needed) =====
function subscribeCars() {
  onSnapshot(collection(db, 'cars'), snap => {
    $('dbError').classList.add('hidden');
    cars = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    renderCars();
  }, showDbError);
}

function renderCars() {
  const filter = $('searchInput').value.trim().toLowerCase();
  const list = cars.filter(c => {
    if (!filter) return true;
    return [c.vin, c.make, c.model, c.plate, c.year, c.phone]
      .join(' ').toLowerCase().includes(filter);
  });
  if (!list.length) {
    $('carsList').innerHTML = '<div class="empty">' +
      (cars.length ? 'Nothing found' : 'No vehicles yet.<br>Tap "+ Car" to add the first one.') + '</div>';
    return;
  }
  $('carsList').innerHTML = list.map(c => `
    <div class="card" onclick="openCar('${c.id}')">
      <div class="card-title">${esc(c.make)} ${esc(c.model)} ${esc(c.year || '')}</div>
      <div class="card-sub">
        VIN: <span class="vin-badge">${esc(c.vin)}</span><br>
        ${c.plate ? 'Plate: ' + esc(c.plate) + '<br>' : ''}
        ${c.mileage ? 'Mileage: ' + Number(c.mileage).toLocaleString('en-US') + ' mi<br>' : ''}
        ${c.phone ? 'Phone: ' + esc(c.phone) : ''}
      </div>
    </div>`).join('');
}
$('searchInput').oninput = renderCars;

$('addCarBtn').onclick = () => {
  editingCarId = null;
  $('carModalTitle').textContent = 'New vehicle';
  $('carModal').classList.remove('hidden');
  $('carModalError').textContent = '';
  $('vinStatus').textContent = '';
  $('carState').value = localStorage.getItem('carState') || 'NY';
  ['vinInput','carMake','carModel','carYear','carPlate','carMileage','carPhone','carCustomer','carNotes']
  fillStateSelect();
    .forEach(id => $(id).value = '');
};
$('cancelCarBtn').onclick = () => $('carModal').classList.add('hidden');

$('saveCarBtn').onclick = async () => {
  const vin = $('vinInput').value.trim().toUpperCase();
  const plate = $('carPlate').value.trim().toUpperCase();
  if (!vin && !plate) {
    $('carModalError').textContent = 'Enter VIN or license plate (at least one)';
    return;
  }
  if (vin && !/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) {
    $('carModalError').textContent = 'VIN must be exactly 17 characters (no I, O, Q), or leave empty';
    return;
  }
  if (vin && cars.some(c => c.vin === vin && c.id !== editingCarId)) {
    $('carModalError').textContent = 'A vehicle with this VIN already exists';
    return;
  }
  const data = {
    vin,
    make: $('carMake').value.trim(),
    model: $('carModel').value.trim(),
    year: +$('carYear').value || null,
    plate: $('carPlate').value.trim().toUpperCase() + ' ' + $('carState').value,
    state: $('carState').value,
    mileage: +$('carMileage').value || null,
    phone: $('carPhone').value.trim(),
    customer: $('carCustomer').value.trim(),
    notes: $('carNotes').value.trim()
  };
  localStorage.setItem('carState', $('carState').value);
  const btn = $('saveCarBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    if (editingCarId) {
      await updateDoc(doc(db, 'cars', editingCarId), data);
    } else {
      await addDoc(collection(db, 'cars'), {
        ...data,
        createdBy: user.displayName || user.email,
        createdAt: Date.now()
      });
    }
    editingCarId = null;
    $('carModal').classList.add('hidden');   // close FIRST, always
    toast('Vehicle saved');
  } catch (e) {
    $('carModalError').textContent = 'Save error: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
};

// Редактирование машины: открываем ту же форму с заполненными полями
window.editCar = () => {
  const car = cars.find(c => c.id === currentCarId);
  if (!car) return;
  editingCarId = car.id;
  $('carModalTitle').textContent = 'Edit vehicle';
  $('vinInput').value = car.vin || '';
  $('carMake').value = car.make || '';
  $('carModel').value = car.model || '';
  $('carYear').value = car.year || '';
  const plateParts = String(car.plate || '').split(' ');
  $('carPlate').value = plateParts[0] || '';
  $('carState').value = (car.state || plateParts[1] || 'NY');
  $('carMileage').value = car.mileage || '';
  $('carPhone').value = car.phone || '';
  $('carCustomer').value = car.customer || '';
  $('carNotes').value = car.notes || '';
  $('carModalError').textContent = '';
  $('vinStatus').textContent = '';
  $('carModal').classList.remove('hidden');
};

// VIN OCR from photo
$('vinPhotoInput').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  $('vinStatus').textContent = 'Recognizing VIN from photo...';
  try {
    const result = await Tesseract.recognize(file, 'eng', {
      tessedit_char_whitelist: 'ABCDEFGHJKLMNPRSTUVWXYZ0123456789',
      tessedit_pageseg_mode: '6'
    });
    const text = (result.data.text || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    const matches = text.match(/[A-HJ-NPR-Z0-9]{17}/g);
    if (matches && matches.length) {
      const best = matches.sort((a, b) => scoreVin(b) - scoreVin(a))[0];
      $('vinInput').value = best;
      const valid = vinCheckDigitOK(best) ? ' (check digit OK)' : ' (check digit MISMATCH — verify!)';
      $('vinStatus').textContent = '✅ VIN found: ' + best + valid + ' — check it, then tap "Decode VIN"';
    } else {
      $('vinStatus').textContent = '⚠️ VIN not recognized. Try another photo (sharp, close, good light) or type it manually.';
    }
  } catch (err) { $('vinStatus').textContent = '⚠️ Recognition error: ' + err.message; }
};
function scoreVin(v) {
  let sc = v.split('').filter(ch => /\d/.test(ch) || 'WVKAZHFDBSR'.includes(ch)).length;
  if (vinCheckDigitOK(v)) sc += 100;   // настоящий VIN почти всегда проходит проверку
  return sc;
}

// Проверка контрольной цифры VIN (стандарт ISO 3779, позиция 9)
function vinCheckDigitOK(vin) {
  const vals = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
  const wts = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
  let sum = 0;
  for (let i = 0; i < 17; i++) {
    const c = vin[i];
    const val = /\d/.test(c) ? +c : vals[c];
    if (val === undefined) return false;
    sum += val * wts[i];
  }
  const rem = sum % 11;
  return vin[8] === (rem === 10 ? 'X' : String(rem));
}

// VIN decode via free NHTSA API
$('decodeVinBtn').onclick = autoDecodeVin;
async function autoDecodeVin() {
  const vin = $('vinInput').value.trim().toUpperCase();
  if (vin.length !== 17) { $('vinStatus').textContent = 'Enter the VIN first (17 characters)'; return; }
  $('vinStatus').textContent = 'Decoding VIN...';
  try {
    const res = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`);
    const r = (await res.json()).Results[0];
    if (r.Make && r.Make !== 'null') {
      $('carMake').value = r.Make;
      $('carModel').value = r.Model !== 'null' ? r.Model : '';
      $('carYear').value = r.ModelYear && r.ModelYear !== '0' ? r.ModelYear : '';
      $('vinStatus').textContent = '✅ Data filled in automatically';
    } else {
      $('vinStatus').textContent = '⚠️ VIN not found in database. Fill in the fields manually.';
    }
  } catch (e) { $('vinStatus').textContent = '⚠️ No internet — decoding unavailable'; }
}

function subscribeWorks(carId) {
  onSnapshot(collection(db, 'cars', carId, 'works'), snap => {
    works = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    renderWorks();
  }, showDbError);
}

function renderWorks() {
  if (!works.length) {
    $('worksList').innerHTML = '<div class="empty">No jobs yet.<br>Tap "+ Job" to add one.</div>';
    return;
  }
  const mineOnly = $('worksFilter').value === 'mine';
  const me = user.displayName || user.email;
  const list = mineOnly ? works.filter(w => (w.mechanic || '') === me) : works;
  if (!list.length) {
    $('worksList').innerHTML = '<div class="empty">' +
      (mineOnly ? 'No your jobs for this vehicle' : 'No jobs yet') + '</div>';
    return;
  }
  const groups = {};
  list.forEach(w => { (groups[w.date] = groups[w.date] || []).push(w); });
  const dates = Object.keys(groups).sort((a, b) => String(b).localeCompare(String(a)));
  const total = list.reduce((s, w) => s + (+w.parts || 0) + (+w.labor || 0), 0);
  $('worksList').innerHTML = '<div class="work-total">Total: ' + money(total) + '</div>' + dates.map(d => {
    const jobs = groups[d];
    const jobsHtml = jobs.map(w => {
      const sum = (+w.parts || 0) + (+w.labor || 0);
      const photos = (w.photos || []).map(u =>
        `<img src="${u}" style="width:64px;height:64px;object-fit:cover;border-radius:8px" loading="lazy">`).join('');
      return `
      <div class="card">
        <div class="card-row">
          <div class="card-title">${esc(w.type)}</div>
          <span class="badge-money">${money(sum)}</span>
        </div>
        <div class="card-sub">
          👤 ${esc(w.mechanic || '')}
          ${w.parts ? `<br>Parts: ${money(w.parts)}` : ''}
          ${w.labor ? ` · Labor: ${money(w.labor)}` : ''}
          ${w.comment ? `<br>${esc(w.comment)}` : ''}
          ${photos ? `<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${photos}</div>` : ''}
        </div>
        <div class="card-row">
          <span></span>
          <span>
            <button class="btn btn-small" onclick="editWork('${w.id}')">Edit</button>
            <button class="btn btn-small btn-danger" onclick="deleteWork('${w.id}')">Delete</button>
          </span>
        </div>
      </div>`;
    }).join('');
    return `
      <div class="date-group">
        <button class="date-header" onclick="toggleGroup('g_${d}')">
          <span>📅 ${fmtDate(d)}</span>
          <span class="muted small">${jobs.length} job(s) · tap to show</span>
        </button>
        <div id="g_${d}" class="hidden">${jobsHtml}</div>
      </div>`;
  }).join('');
}

window.toggleGroup = id => $(id).classList.toggle('hidden');

window.editWork = id => {
  const w = works.find(x => x.id === id);
  if (!w) return;
  editingWorkId = id;
  if (!workTypes.includes(w.type)) workTypes.push(w.type);
  fillTypeSelect();
  $('workModalTitle').textContent = 'Edit job';
  $('workDate').value = w.date || today();
  $('workMechanic').value = w.mechanic || '';
  $('workType').value = w.type;
  $('workParts').value = w.parts || '';
  $('workLabor').value = w.labor || '';
  $('workComment').value = w.comment || '';
  selectedPhotos = []; $('photoPreview').innerHTML = ''; $('workPhotos').value = '';
  $('photoPreview').innerHTML = (w.photos || []).map(u =>
    `<img src="${u}" style="width:64px;height:64px;object-fit:cover;border-radius:8px;opacity:.6">`).join('');
  $('workModalError').textContent = '';
  $('workModal').classList.remove('hidden');
};

window.deleteWork = async workId => {
  if (!confirm('Delete this job record?')) return;
  try {
    await deleteDoc(doc(db, 'cars', currentCarId, 'works', workId));

  } catch (e) { toast('Error: ' + e.message); }

// Сжатие фото перед загрузкой: до 1600px, JPEG 70% (в 20-30 раз легче)
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, rej) => setTimeout(() => rej(new Error(label + ' timeout')), ms))
  ]);
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600;
      let w = img.width, h = img.height;
      if (w > max || h > max) {
        if (w >= h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob(b => b ? resolve(b) : reject(new Error('compress failed')), 'image/jpeg', 0.7);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('cannot read image')); };
    img.src = url;
  });
}

$('saveWorkBtn').onclick = async () => {
  const type = $('workType').value, date = $('workDate').value;
  if (!type || !date) { $('workModalError').textContent = 'Select job type and date'; return; }
  const btn = $('saveWorkBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  let photoUrls = [];
  const photoErrors = [];
  try {
    for (let i = 0; i < selectedPhotos.length; i++) {
      btn.textContent = `Photo ${i + 1}/${selectedPhotos.length}...`;
      try {
        let blob = null;
        try { blob = await compressImage(selectedPhotos[i]); }
        catch (e) {
          // HEIC/HEIF или нечитаемый формат — отправляем оригинал как есть
          blob = selectedPhotos[i];
          console.warn('compress failed, sending original:', e);
        }
        const ext = (selectedPhotos[i].name && selectedPhotos[i].name.split('.').pop().toLowerCase()) || 'jpg';
        const path = `works/${currentCarId}/${Date.now()}_${i}.${ext === 'heic' ? 'heic' : ext}`;
        await withTimeout(uploadBytes(sRef(storage, path), blob), 30000, 'Upload');
        photoUrls.push(await withTimeout(getDownloadURL(sRef(storage, path)), 15000, 'URL'));
      } catch (pe) {
        console.warn('photo upload failed:', pe);
        photoErrors.push((pe && (pe.code || pe.message)) || String(pe));
      }
    }
    btn.textContent = 'Saving...';
    const data = {
      type, date,
      parts: +$('workParts').value || 0,
      labor: +$('workLabor').value || 0,
      comment: $('workComment').value.trim(),
      mechanic: $('workMechanic').value.trim() || (user.displayName || user.email)
    };
    if (editingWorkId) {
      const orig = works.find(w => w.id === editingWorkId);
      await updateDoc(doc(db, 'cars', currentCarId, 'works', editingWorkId),
        { ...data, photos: [...((orig && orig.photos) || []), ...photoUrls] });
    } else {
      await addDoc(collection(db, 'cars', currentCarId, 'works'), {
        ...data,
        photos: photoUrls,
        mechanic: user.displayName || user.email,
        createdAt: Date.now()
      });
    }
    editingWorkId = null;
    $('workModal').classList.add('hidden');   // close FIRST, always
    if (photoErrors.length) {
      toast('Job saved, PHOTO ERROR: ' + photoErrors[0]);
    } else {
      toast('Job saved');
    }
  } catch (e) {
    $('workModalError').textContent = 'Error: ' + e.message;
  } finally {
    btn.disabled = false; btn.textContent = 'Save';
  }
};

// ===== INVOICE PDF =====
window.generateInvoice = () => {
  const car = cars.find(c => c.id === currentCarId);
  if (!car || !window.jspdf) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 20;
  doc.setFontSize(16);
  doc.text((company.name || "Mechanic's Garage") + ' - Service Invoice', 105, y, { align: 'center' });
  y += 6;
  doc.setFontSize(9);
  if (company.address) { doc.text(company.address, 105, y, { align: 'center' }); y += 4; }
  if (company.phone) { doc.text('Tel: ' + company.phone, 105, y, { align: 'center' }); y += 4; }
  y += 4;
  doc.setFontSize(10);
  doc.text('Invoice date: ' + new Date().toLocaleDateString('en-US'), 14, y); y += 6;
  doc.text(`Vehicle: ${car.make || ''} ${car.model || ''} ${car.year || ''}`.trim(), 14, y); y += 6;
  doc.text(`VIN: ${car.vin || '-'}    Plate: ${car.plate || '-'}    Mileage: ${car.mileage ? Number(car.mileage).toLocaleString('en-US') + ' mi' : '-'}`, 14, y); y += 6;
  doc.text('Customer: ' + (car.customer || '-') + (car.phone ? '    Phone: ' + car.phone : ''), 14, y); y += 6;
  y += 4;
  doc.setFont(undefined, 'bold');
  doc.text('Date', 14, y); doc.text('Job description', 45, y);
  doc.text('Parts', 135, y); doc.text('Labor', 165, y); y += 2;
  doc.line(14, y, 196, y); y += 6;
  doc.setFont(undefined, 'normal');
  let tp = 0, tl = 0;
  works.forEach(w => {
    if (y > 262) { doc.addPage(); y = 20; }
    tp += +w.parts || 0; tl += +w.labor || 0;
    doc.text(fmtDate(w.date), 14, y);
    doc.text(String(w.type || '').slice(0, 45), 45, y);
    doc.text('$' + (+w.parts || 0).toFixed(2), 135, y);
    doc.text('$' + (+w.labor || 0).toFixed(2), 165, y);
    y += 6;
    if (w.mechanic) { doc.setFontSize(8); doc.setTextColor(120); doc.text('  by ' + String(w.mechanic).slice(0, 40), 45, y); y += 4; doc.setFontSize(10); doc.setTextColor(0); }
    if (w.comment) { doc.setFontSize(8); doc.setTextColor(120); doc.text('  ' + String(w.comment).slice(0, 85), 45, y); y += 5; doc.setFontSize(10); doc.setTextColor(0); }
    y += 1;
  });
  y += 2; doc.line(14, y, 196, y); y += 7;
  const taxRate = (parseFloat(company.tax) || 8.875) / 100;
  const tax = tp * taxRate;
  doc.setFont(undefined, 'bold');
  doc.text('Parts total: $' + tp.toFixed(2), 135, y); y += 6;
  doc.text('Labor total: $' + tl.toFixed(2), 135, y); y += 6;
  doc.setFont(undefined, 'normal');
  doc.text('Sales tax (' + (taxRate * 100).toFixed(3) + '%): $' + tax.toFixed(2), 135, y); y += 7;
  doc.setFont(undefined, 'bold');
  doc.setFontSize(12);
  doc.text('TOTAL: $' + (tp + tl + tax).toFixed(2), 135, y);
  doc.save('invoice_' + (car.plate || car.vin || 'vehicle') + '.pdf');
};

let toastTimer;
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add('hidden'), 2500);
}
window.toast = toast;
